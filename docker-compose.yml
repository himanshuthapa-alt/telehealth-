# Local development database. Start with: npm run db:up
services:
  postgres:
    image: postgres:18-alpine
    container_name: telecare-postgres
    environment:
      POSTGRES_USER: telecare
      POSTGRES_PASSWORD: telecare_dev_password # dev-only, never used outside this container
      POSTGRES_DB: telecare
    ports:
      - '5432:5432'
    volumes:
      - telecare-pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telecare -d telecare']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  telecare-pgdata:
